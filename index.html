
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaamarket - Ma boutique en ligne</title>

  <style>
    :root {
      --orange: #FF7900;
      --black: #111111;
      --white: #FFFFFF;
      --gray: #F5F5F5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--gray);
      color: var(--black);
    }

    header {
      background: var(--black);
      color: white;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .logo span {
      color: var(--orange);
    }

    nav {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    .cart {
      background: var(--orange);
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
    }

    .hero {
      background: var(--black);
      color: white;
      padding: 65px 7%;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(30px, 5vw, 48px);
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: var(--orange);
    }

    .hero p {
      color: #DDDDDD;
      margin-bottom: 25px;
    }

    .search {
      max-width: 500px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    .search input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      border: none;
      background: var(--orange);
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
    }

    main {
      padding: 35px 7%;
    }

    .section-title {
      font-size: 26px;
      margin-bottom: 20px;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 35px;
    }

    .category {
      background: white;
      color: var(--black);
      border: 1px solid #DDDDDD;
      border-radius: 25px;
      padding: 10px 18px;
    }

    .category.active {
      background: var(--orange);
      color: white;
      border-color: var(--orange);
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 3px 12px #00000008;
    }

    .product-icon {
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #FFF3E8;
      border-radius: 10px;
      font-size: 45px;
      margin-bottom: 18px;
    }

    .product h3 {
      margin-bottom: 10px;
    }

    .product p {
      color: #666666;
      margin-bottom: 15px;
    }

    .price {
      color: var(--orange);
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .product button {
      width: 100%;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #666666;
      grid-column: 1 / -1;
    }

    footer {
      background: var(--black);
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 40px;
    }

    footer span {
      color: var(--orange);
    }

    @media (max-width: 600px) {
      header {
        padding: 18px 5%;
      }

      nav {
        width: 100%;
        justify-content: space-between;
      }

      main {
        padding: 25px 5%;
      }

      .hero {
        padding: 45px 5%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Zaa<span>market</span></div>

    <nav>
  <a href="#">Accueil</a>
  <a href="#produits">Produits</a>
  <a href="#categories">Catégories</a>
  <a href="#vendeur">Espace vendeur</a>
      <div class="cart">
        🛒 Panier : <span id="cart-count">0</span>
      </div>
    </nav>
  </header>

  <section class="hero">
    <h1>Bienvenue chez <span>Zaamarket</span></h1>

    <p>Tout ce que vous aimez, au même endroit.</p>

    <div class="search">
      <input
        type="text"
        id="search"
        placeholder="Rechercher un produit..."
      >

      <button onclick="renderProducts()">Rechercher</button>
    </div>
  </section>

  <main>
    <section id="categories">
      <h2 class="section-title">Nos catégories</h2>

      <div class="categories">
        <button class="category active"
          onclick="selectCategory('Tous', this)">
          Tous
        </button>

        <button class="category"
          onclick="selectCategory('Mode', this)">
          Mode
        </button>

        <button class="category"
          onclick="selectCategory('Électronique', this)">
          Électronique
        </button>

        <button class="category"
          onclick="selectCategory('Scolaire', this)">
          Scolaire
        </button>

        <button class="category"
          onclick="selectCategory('Maison', this)">
          Maison
        </button>
      </div>
    </section>

    <section id="produits">
      <h2 class="section-title">Nos produits</h2>

      <div class="products" id="product-list"></div>
    </section>
  </main>

  <footer>
    <p>© 2026 <span>Zaamarket</span> - Tous droits réservés.</p>
    <p>Tout ce que vous aimez, au même endroit.</p>
  </footer>

  <script>
    const products = [
      {
        id: 1,
        name: "Sac scolaire",
        category: "Scolaire",
        price: 7500,
        icon: "🎒"
      },
      {
        id: 2,
        name: "Écouteurs Bluetooth",
        category: "Électronique",
        price: 10000,
        icon: "🎧"
      },
      {
        id: 3,
        name: "Montre élégante",
        category: "Mode",
        price: 12000,
        icon: "⌚"
      },
      {
        id: 4,
        name: "Lampe de bureau",
        category: "Maison",
        price: 8500,
        icon: "💡"
      }
    ];

    let cart = [];
    let currentCategory = "Tous";

    function renderProducts() {
      const list = document.getElementById("product-list");
      const search = document
        .getElementById("search")
        .value.toLowerCase();

      const filtered = products.filter(product => {
        const matchesSearch = product.name
          .toLowerCase()
          .includes(search);

        const matchesCategory =
          currentCategory === "Tous" ||
          product.category === currentCategory;

        return matchesSearch && matchesCategory;
      });

      list.innerHTML = "";

      if (filtered.length === 0) {
        list.innerHTML =
          '<p class="empty">Aucun produit trouvé.</p>';
        return;
      }

      filtered.forEach(product => {
        const card = document.createElement("div");
        card.className = "product";

        card.innerHTML = `
          <div class="product-icon">${product.icon}</div>
          <h3>${product.name}</h3>
          <p>${product.category}</p>
          <div class="price">
            ${product.price.toLocaleString("fr-FR")} FCFA
          </div>
          <button onclick="addToCart(${product.id})">
            Ajouter au panier
          </button>
        `;

        list.appendChild(card);
      });
    }

    function selectCategory(category, button) {
      currentCategory = category;

      document.querySelectorAll(".category")
        .forEach(item => item.classList.remove("active"));

      button.classList.add("active");

      renderProducts();
    }

    function addToCart(id) {
      cart.push(id);

      document.getElementById("cart-count").textContent =
        cart.length;

      alert("Produit ajouté au panier !");
    }

    document.getElementById("search")
      .addEventListener("input", renderProducts);

    renderProducts();
  </script>

</body>
</html>
